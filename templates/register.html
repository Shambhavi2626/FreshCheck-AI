<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreshCheck AI — Create your account</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="auth-wrap"><section class="auth-card"><div class="brand">🍎 FreshCheck AI</div><h1>Create your account</h1><p>Sign in to securely access your food quality scans and history.</p>{% if error %}<div class="auth-error">{{ error }}</div>{% endif %}<form method="post"><label for="name">Full name</label><input id="name" name="name" type="text" required ><label for="email">Email address</label><input id="email" name="email" type="email" required ><label for="password">Password (minimum 6 characters)</label><input id="password" name="password" type="password" required minlength="6"><button class="primary" type="submit">Register</button></form><a class="auth-link" href="/login">Already have an account? Log in</a></section></main></body></html>
